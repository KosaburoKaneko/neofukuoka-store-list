<!doctype html>
<html lang="ja">

<head>
  <link rel="canonical" href="https://store-list.neo-fukuoka.jp/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ネオ柚子胡椒は福岡空港や博多駅をはじめ、お土産店で販売中。オンラインでも購入可能。販売店や取扱店の詳細はこちら。">
  <meta property="og:title" content="販売店・取扱店情報 | ネオ柚子胡椒の公式オンラインストア「ネオフクオカ」" />
  <meta property="og:description" content="ネオ柚子胡椒は福岡空港や博多駅をはじめ、お土産店で販売中。オンラインでも購入可能。販売店や取扱店の詳細はこちら。">
  <title>販売店・取扱店情報 | ネオ柚子胡椒の公式オンラインストア「ネオフクオカ」</title>
  <style>
    :root {
      --bg: #fff;
      --text: #111;
      --muted: #9CA3AF;
      --line: #E5E7EB;
      --accent: #6b8e23;
      --maxw: 720px;
      --radius: 14px;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    .searchwrap {
      padding: 12px 16px 0
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #efefef;
      border-radius: 20px;
      padding: 10px 12px
    }

    .search svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px
    }

    .search input {
      border: 0;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 16px
    }

    .section {
      padding: 8px 0 4px;
      margin: 0 16px;
      font-size: 22px;
      font-weight: 800
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 8px 0
    }

    .list {
      margin: 0;
      padding: 0 0 0 16px;
      list-style: none
    }

    .list .item:last-child {
      border-bottom: 0;
    }

    .item {
      display: flex;
      align-items: center;
      padding: 14px 16px 14px 0;
      border-bottom: 1px solid var(--line)
    }

    .rowlink {
      display: flex;
      align-items: center;
      color: inherit;
      text-decoration: none;
    }

    .thumb {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      background: #f2f2f2;
      flex: 0 0 60px
    }

    .meta {
      flex: 1;
      min-width: 0;
      margin-left: 12px
    }

    .addr {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px
    }

    .name {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2
    }

    .branch {
      color: #9CA3AF;
      font-size: 14px;
      margin-top: 4px
    }

    .chev {
      flex: 0 0 18px;
      display: flex;
      justify-content: flex-end;
      color: #9CA3AF
    }

    .chev svg {
      width: 18px;
      height: 18px
    }

    .hidden {
      display: none
    }

    .filter-wrap {
      padding: 16px 32px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .filter-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .products {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      font-size: 11px;
      --chip-color: var(--accent);
      color: var(--chip-color);
      border: 1px solid rgba(107, 142, 35, 0.35);
      border-radius: 999px;
      padding: 2px 8px;
      background: rgba(107, 142, 35, 0.08);
      font-weight: 700;
    }

    .chip[data-product="ごはんにかけるもつ鍋醤油味"] {
      --chip-color: #7a4b2a;
      border-color: rgba(122, 75, 42, 0.35);
      background: rgba(122, 75, 42, 0.12);
    }
  </style>
</head>

<body>
  <div class="searchwrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input id="q" type="search" placeholder="検索">
    </div>
  </div>

  <!-- PRODUCT FILTER -->
  <!-- PRODUCT_FILTER_PLACEHOLDER -->

  <div class="wrap" id="root">
    <!-- LIST_GROUPS_PLACEHOLDER -->
  </div>

  <!-- JSON-LD -->
  <!-- JSONLD_PLACEHOLDER -->

  <script>
    (function () {
      const q = document.getElementById('q');
      const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
      const filterButtons = document.querySelectorAll('[data-product-filter]');
      let activeProduct = 'all';
      function syncButtons() {
        filterButtons.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.productFilter === activeProduct);
        });
      }
      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          activeProduct = btn.dataset.productFilter;
          syncButtons();
          filter();
        });
      });
      function filter() {
        const k = norm(q.value);
        document.querySelectorAll('.item').forEach(li => {
          const hay = li.getAttribute('data-hay');
          const products = li.getAttribute('data-products') || '';
          const productOk = activeProduct === 'all' || products.split('|').includes(activeProduct);
          const show = (!k || hay.includes(k)) && productOk;
          li.style.display = show ? '' : 'none';
        });
        document.querySelectorAll('[data-section]').forEach(sec => {
          const vis = sec.querySelectorAll('.item:not([style*="display: none"])').length;
          sec.classList.toggle('hidden', vis === 0);
        });
        // ★ 各セクション内の「見えている最後の行」だけ下線を消す
        document.querySelectorAll('.list').forEach(ul => {
          const items = Array.from(ul.querySelectorAll('.item'));
          // いったん全行の下線を有効化
          items.forEach(li => { li.style.borderBottom = '1px solid var(--line)'; });
          // 見えている行を抽出して最後の1つの下線だけ消す
          const visible = items.filter(li => li.style.display !== 'none');
          if (visible.length) {
            visible[visible.length - 1].style.borderBottom = '0';
          }
        });
      }
      q.addEventListener('input', filter);
      syncButtons();
      filter();
    })();
  </script>
</body>

</html>
